<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Matches surface-0 of the default pack, so the browser chrome and the overscroll area
         do not flash a lighter color before the stylesheet lands. -->
    <meta name="theme-color" content="#0B0D10" />
    <title>Tracker</title>
    <!-- The mark, which nothing linked to before this: `public/favicon.svg` has shipped since
         Phase 1 and no <link> referenced it, so every browser fell back to requesting
         /favicon.ico, getting the SPA's index.html, and drawing its default page glyph. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest's icons entirely and reads this one. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
